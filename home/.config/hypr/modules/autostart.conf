#################
### AUTOSTART  ###
#################

# Wallpaper daemon + restore last-used wallpaper from saved file
exec-once = swww-daemon
exec-once = sh -c '[ -f ~/.cache/last-wallpaper ] && swww img "$(readlink -f ~/.cache/last-wallpaper)" || swww img ~/Pictures/wallpapers/megumi.png'

exec-once = waybar
exec-once = mako
exec-once = hyprlock

