# hypridle.conf — invokes the existing hyprlock setup (NOT replacing it).
# Timeouts per user spec:
#   5 min  → lock screen (existing hyprlock command)
#   15 min → system suspend

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
    ignore_dbus_inhibit = false
}

# Screenlock after 5 minutes of idle
listener {
    timeout = 300
    on-timeout = hyprlock
}

# Suspend after 15 minutes of idle
listener {
    timeout = 900
    on-timeout = systemctl suspend
}
