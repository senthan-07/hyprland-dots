# hyprlock.conf — Cinematic minimalist redesign (Session 3)
# Background: current wallpaper (via symlink, no blur)
# Layout: clock + date + password + hint, vertically centered
# Theme: neutral (white text on wallpaper) — no theme integration
#
# Rollback: cp ~/.config/hypr/hyprlock.conf.before-redesign ~/.config/hypr/hyprlock.conf
#
# Tested syntax (hyprlock v0.9.2):
#   - input-field only accepts fail_color for custom colors
#   - placeholder_color / outline_color / dot_color removed in v0.9.2
#   - No blur/noise/contrast/brightness/vibrancy — kept clean cinematic look
#
# Layout positions (origin = each monitor's center):
#   Clock    : 0, 220   (above center)
#   Date     : 0, 100   (just below clock)
#   Password : 0, -60   (below center)
#   Hint     : 0, -130  (below password)

general {
    hide_cursor = true
}

background {
    monitor =
    path = ~/.cache/current-wallpaper
    blur_size = 3
    blur_passes = 2
}

# Clock — single horizontal HH:MM
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = rgba(245, 245, 250, 1.0)
    font_size = 100
    font_family = JetBrainsMono Nerd Font
    shadow_passes = 2
    shadow_size = 4

    position = 0, 220
    halign = center
    valign = center
}

# Date — below clock
label {
    monitor =
    text = cmd[update:18000000] echo "$(date +'%A, %B %-d')"
    color = rgba(255, 255, 255, 1.0)
    font_size = 26
    font_family = JetBrainsMono Nerd Font

    shadow_passes = 4
    shadow_size = 6
    shadow_color = rgba(0, 0, 0, 0.85)

    position = 0, 100
    halign = center
    valign = center
}

# Password input — wide rounded field
input-field {
    monitor =
    size = 430, 60
    outline_thickness = 3
    fade_on_empty = false
    placeholder_text = <i>ENTER YOUR PASSWORD</i>
    fail_text = Wrong password

    position = 0, -60
    halign = center
    valign = center

    fail_color = rgba(255, 98, 77, 1.0)
}

# Hint label
label {
    monitor =
    text = Press Enter to unlock
    color = rgba(230, 230, 240, 0.75)
    font_size = 16
    font_family = JetBrainsMono Nerd Font

    position = 0, -130
    halign = center
    valign = center
}
